<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Pip</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
  <div class="bubble" id="bubble" data-hit hidden>
    <p id="bubble-text"></p>
    <div class="bubble-actions" id="bubble-actions" hidden>
      <button type="button" id="b-done">Done</button>
      <button type="button" id="b-snooze">Snooze 10 min</button>
      <button type="button" id="b-x" aria-label="Dismiss">&times;</button>
    </div>
  </div>
  <button class="pip" id="pip" type="button" data-hit aria-label="Pip"><span class="sprite" id="sprite"></span></button>
  <div class="menu" id="menu" data-hit>
    <button class="opt" type="button" data-new="list">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M4 7l2 2 3-3M12 7h8M4 16l2 2 3-3M12 16h8"/></svg></span>
      <span><b>New checklist</b></span>
    </button>
    <button class="opt alt" type="button" data-new="note">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg></span>
      <span><b>Blank note</b></span>
    </button>
  </div>
  <script src="pet.js"></script>
</body>
</html>
